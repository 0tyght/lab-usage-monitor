<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # PHP may read application files, but HTTP clients must not download them.
    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes -FollowSymLinks -MultiViews
        AllowOverride None
        DirectoryIndex index.php
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <Directory /var/www/html/public/assets>
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
