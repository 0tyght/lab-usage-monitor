name: lums-production

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lums-app:production
    ports:
      - "127.0.0.1:8086:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS URL}
      APP_TIMEZONE: Asia/Bangkok
      LUMS_DB_DSN: sqlite:/var/www/html/storage/lums.sqlite
      LUMS_SESSION_PATH: /var/www/html/storage/sessions
      LUMS_SECURE_COOKIES: "true"
      LUMS_ADMIN_NAME: ${LUMS_ADMIN_NAME:-ผู้ดูแลระบบ LUMS}
      LUMS_ADMIN_EMAIL: ${LUMS_ADMIN_EMAIL:?Set the first administrator email}
      LUMS_ADMIN_PASSWORD: ${LUMS_ADMIN_PASSWORD:?Set a password of at least 12 characters}
    volumes:
      - lums_storage:/var/www/html/storage
    restart: always
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/?health=1') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  lums_storage:

