name: Deploy LUMS gateway to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['pages/**', 'tests/gateway.test.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test permanent gateway and redirect safety
        run: node --test tests/gateway.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy permanent gateway
        id: deployment
        uses: actions/deploy-pages@v4
