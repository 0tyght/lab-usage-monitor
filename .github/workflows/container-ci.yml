name: Container CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build test image
        run: docker build --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" -t lums-ci:${{ github.sha }} .

      - name: Lint PHP and JavaScript
        run: |
          docker run --rm --entrypoint sh lums-ci:${{ github.sha }} -c 'find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l'
          node --check assets/app.js

      - name: Verify production bootstrap
        run: |
          docker run --rm --entrypoint php \
            -e APP_ENV=production \
            -e LUMS_ADMIN_EMAIL=admin@example.invalid \
            -e LUMS_ADMIN_PASSWORD=CiOnlyPassword-2569 \
            lums-ci:${{ github.sha }} scripts/init.php

      - name: Test UX status filters and lecturer scope
        run: docker run --rm --entrypoint php lums-ci:${{ github.sha }} tests/ux-regression.php

      - name: Test free online gateway
        run: node --test tests/gateway.test.mjs

      - name: Verify HTTP serving and private file isolation
        run: |
          docker run --rm --entrypoint apache2ctl lums-ci:${{ github.sha }} -t
          docker run -d --name lums-http-check \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_URL=https://0tyght.github.io/lab-usage-monitor \
            -e LUMS_GATEWAY_ORIGIN=https://0tyght.github.io \
            -e LUMS_GATEWAY_ID=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e LUMS_SECURE_COOKIES=true \
            -e LUMS_ADMIN_EMAIL=admin@example.invalid \
            -e LUMS_ADMIN_PASSWORD=CiOnlyPassword-2569 \
            lums-ci:${{ github.sha }}
          trap 'docker logs lums-http-check; docker rm -f lums-http-check' EXIT
          docker exec -e LUMS_HTTP_TEST=1 lums-http-check php tests/http-smoke.php
          docker exec lums-http-check php scripts/online-preflight.php
          if docker exec -e LUMS_SECURE_COOKIES=false lums-http-check php scripts/online-preflight.php; then
            echo 'Unsafe online configuration was accepted'
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable and latest images
        if: github.event_name == 'push'
        run: |
          docker tag lums-ci:${{ github.sha }} "${IMAGE_NAME}:${{ github.sha }}"
          docker tag lums-ci:${{ github.sha }} "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"
